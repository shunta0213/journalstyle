[project]
name = "journalstyle"
version = "0.1.0"
description = "Matplotlib styles sized to journal column widths"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
journalstyle = ["styles/*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
